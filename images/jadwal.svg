<svg
  width="16"
  height="20"
  viewBox="0 0 16 20"
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
  stroke="currentColor"
  stroke-width="1"
  stroke-linecap="round"
  stroke-linejoin="round">

  <!-- Calendar outline -->
  <rect x="1" y="2" width="14" height="17" rx="2" />

  <!-- Header -->
  <rect x="1" y="2" width="14" height="4" fill="currentColor" stroke="none"/>

  <!-- Rings -->
  <line x1="5" y1="0.5" x2="5" y2="4" stroke-width="1.5"/>
  <line x1="11" y1="0.5" x2="11" y2="4" stroke-width="1.5"/>

  <!-- Static schedule lines -->
  <line x1="4" y1="10" x2="12" y2="10"/>
  <line x1="4" y1="14" x2="12" y2="14"/>

  <!-- Animated active schedule -->
  <line x1="4" y1="12" x2="12" y2="12" stroke-width="1.5">
    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="1.2s"
      repeatCount="indefinite"/>
  </line>
</svg>
