<svg
  width="16"
  height="20"
  viewBox="0 0 16 20"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Book cover -->
  <rect
    x="2"
    y="1"
    width="12"
    height="18"
    rx="2"
    ry="2"
    fill="#1B5E20"
  />

  <!-- Spine -->
  <rect
    x="3.5"
    y="1"
    width="1.5"
    height="18"
    fill="#2E7D32"
  />

  <!-- Inner frame -->
  <rect
    x="5.2"
    y="4"
    width="7.3"
    height="12"
    rx="1"
    fill="none"
    stroke="#C8E6C9"
    stroke-width="0.8"
  />

  <!-- Center ornament -->
  <circle
    cx="8.9"
    cy="10"
    r="1.1"
    fill="#C8E6C9"
  />
</svg>
