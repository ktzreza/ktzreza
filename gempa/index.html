<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BMKG Info Gempa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --bg-card: rgba(22, 27, 34, 0.55);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --text: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #484f58;
            --accent: #00d4ff;
            --accent-soft: rgba(0, 212, 255, 0.15);
            --danger: #ff6b6b;
            --danger-soft: rgba(255, 107, 107, 0.15);
            --warning: #ffd93d;
            --warning-soft: rgba(255, 217, 61, 0.15);
            --success: #6bcb77;
            --success-soft: rgba(107, 203, 119, 0.15);
            --radius: 24px;
            --radius-sm: 16px;
            --radius-xs: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Bokeh Background */
        .bokeh-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
        }
        .bokeh-bg .spot {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            animation: float 10s ease-in-out infinite;
        }
        .bokeh-bg .spot:nth-child(1) {
            width: 160px; height: 160px;
            background: rgba(0, 212, 255, 0.15);
            top: 5%; left: 10%;
            animation-delay: 0s;
        }
        .bokeh-bg .spot:nth-child(2) {
            width: 240px; height: 240px;
            background: rgba(99, 102, 241, 0.1);
            top: 35%; right: 5%;
            animation-delay: -2s;
        }
        .bokeh-bg .spot:nth-child(3) {
            width: 120px; height: 120px;
            background: rgba(0, 212, 255, 0.1);
            bottom: 15%; left: 20%;
            animation-delay: -4s;
        }
        .bokeh-bg .spot:nth-child(4) {
            width: 200px; height: 200px;
            background: rgba(139, 92, 246, 0.08);
            top: 55%; left: 55%;
            animation-delay: -6s;
        }
        .bokeh-bg .spot:nth-child(5) {
            width: 140px; height: 140px;
            background: rgba(0, 212, 255, 0.08);
            bottom: 5%; right: 20%;
            animation-delay: -3s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(15px, -20px) scale(1.05); }
            66% { transform: translate(-10px, 10px) scale(0.95); }
        }

        .noise {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* Glass Card Base */
        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass:hover {
            border-color: var(--border-hover);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255,255,255,0.05);
        }

        /* Header */
        header {
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13, 17, 23, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 16px;
        }
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .brand-icon {
            width: 32px; height: 32px;
            min-width: 32px;
            background: linear-gradient(135deg, var(--accent), #6366f1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.25);
        }
        .brand-text {
            min-width: 0;
        }
        .brand-text h1 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand-text span {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            background: var(--success-soft);
            border: 1px solid rgba(107, 203, 119, 0.2);
            border-radius: 100px;
            font-size: 0.7rem;
            color: var(--success);
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .live-pill .dot {
            width: 5px; height: 5px;
            min-width: 5px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--success);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Section Title */
        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 28px 0 14px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
        }
        .section-title .icon {
            width: 24px; height: 24px;
            min-width: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-soft);
            border-radius: 6px;
            font-size: 12px;
        }
        .section-title .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border), transparent);
            min-width: 20px;
        }
        .section-title .badge-count {
            padding: 2px 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.6rem;
            color: var(--text-secondary);
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Hero Card */
        .hero-card {
            padding: 20px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.08), rgba(99, 102, 241, 0.04));
        }
        .hero-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.5;
        }
        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: var(--danger-soft);
            border: 1px solid rgba(255, 107, 107, 0.2);
            color: var(--danger);
            border-radius: 100px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }
        .hero-tag .ring {
            width: 4px; height: 4px;
            min-width: 4px;
            background: var(--danger);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        .hero-body {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-start;
        }
        .hero-mag {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--danger), #ff9f43);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.04em;
            flex-shrink: 0;
        }
        .hero-mag .unit {
            font-size: 0.85rem;
            font-weight: 600;
            -webkit-text-fill-color: var(--text-secondary);
            margin-left: 3px;
        }
        .hero-info {
            flex: 1;
            min-width: 0;
        }
        .hero-info h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text);
            line-height: 1.4;
        }
        .hero-info p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .hero-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .chip strong {
            color: var(--text);
            font-weight: 600;
        }
        .hero-shakemap {
            margin-top: 16px;
            width: 100%;
        }
        .hero-shakemap img {
            width: 100%;
            max-width: 100%;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            opacity: 0.9;
            display: block;
        }

        /* Data Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .data-card {
            padding: 18px;
            animation: fadeUp 0.5s ease-out backwards;
        }
        .data-card:nth-child(1) { animation-delay: 0.02s; }
        .data-card:nth-child(2) { animation-delay: 0.04s; }
        .data-card:nth-child(3) { animation-delay: 0.06s; }
        .data-card:nth-child(4) { animation-delay: 0.08s; }
        .data-card:nth-child(5) { animation-delay: 0.10s; }
        .data-card:nth-child(6) { animation-delay: 0.12s; }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 8px;
        }
        .card-mag {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }
        .card-mag .unit {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-left: 2px;
        }
        .card-status {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .status-safe {
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid rgba(107, 203, 119, 0.2);
        }
        .status-danger {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid rgba(255, 107, 107, 0.2);
        }
        .card-loc {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .c-item {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .c-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
        }
        .c-value {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .card-foot {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            gap: 8px;
        }
        .card-foot .depth {
            color: var(--accent);
            font-weight: 600;
            text-align: right;
            line-height: 1.3;
        }
        .card-foot .date {
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Table */
        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .table-wrap::-webkit-scrollbar { display: none; }
        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        thead {
            background: rgba(255,255,255,0.03);
        }
        th {
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.8rem;
            vertical-align: top;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td {
            background: rgba(255,255,255,0.02);
            color: var(--text);
        }
        .t-mag {
            font-weight: 700;
            color: var(--text);
            font-size: 0.9rem;
        }
        .t-wilayah {
            max-width: 200px;
            line-height: 1.4;
        }
        .t-dirasakan {
            max-width: 180px;
            line-height: 1.4;
            font-size: 0.75rem;
        }
        .t-time {
            white-space: nowrap;
        }
        .t-time .date {
            font-weight: 600;
            color: var(--text);
            font-size: 0.82rem;
        }
        .t-time .jam {
            color: var(--text-muted);
            font-size: 0.72rem;
        }

        /* Mobile Card Alternative for Table */
        .mobile-cards {
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .m-card {
            padding: 16px;
            animation: fadeUp 0.4s ease-out backwards;
        }
        .m-card:nth-child(1) { animation-delay: 0.02s; }
        .m-card:nth-child(2) { animation-delay: 0.04s; }
        .m-card:nth-child(3) { animation-delay: 0.06s; }
        .m-card:nth-child(4) { animation-delay: 0.08s; }
        .m-card:nth-child(5) { animation-delay: 0.10s; }
        .m-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 8px;
        }
        .m-card-mag {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
        }
        .m-card-mag .unit {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .m-card-loc {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .m-card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }
        .m-card-meta .chip {
            font-size: 0.7rem;
            padding: 4px 8px;
        }
        .m-card-felt {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.4;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }
        .m-card-felt strong {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: block;
            margin-bottom: 2px;
        }

        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            gap: 14px;
        }
        .spinner {
            width: 32px; height: 32px;
            border: 2.5px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p {
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 500;
        }

        /* Error */
        .error-box {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .error-box h3 {
            color: var(--danger);
            margin-bottom: 6px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .error-box p {
            font-size: 0.85rem;
        }
        .btn {
            margin-top: 16px;
            padding: 12px 32px;
            background: linear-gradient(135deg, var(--accent), #6366f1);
            color: #0d1117;
            border: none;
            border-radius: var(--radius-xs);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.25);
            width: 100%;
            max-width: 200px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(0, 212, 255, 0.35);
        }
        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Footer */
        footer {
            padding: 32px 0 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 500;
        }
        footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tablet */
        @media (min-width: 640px) {
            .container { padding: 0 24px; }
            .brand-text h1 { font-size: 1.1rem; }
            .section-title { font-size: 0.8rem; margin: 32px 0 16px; }
            .section-title .icon { width: 28px; height: 28px; font-size: 13px; }
            .hero-card { padding: 24px; }
            .hero-mag { font-size: 3.2rem; }
            .hero-info h2 { font-size: 1.1rem; }
            .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
            .data-card { padding: 20px; }
            .card-mag { font-size: 1.5rem; }
            .card-loc { font-size: 0.88rem; }
            .card-grid { gap: 10px; }
            .c-value { font-size: 0.85rem; }
            .table-wrap { border-radius: var(--radius); }
            th, td { padding: 14px 16px; }
            .btn { width: auto; }
        }

        /* Desktop */
        @media (min-width: 900px) {
            .container { padding: 0 24px; }
            .hero-mag { font-size: 3.5rem; }
            .hero-card { padding: 28px; }
            .hero-info h2 { font-size: 1.15rem; }
            .cards-grid { grid-template-columns: repeat(3, 1fr); }
            .card-mag { font-size: 1.6rem; }
            .table-wrap { display: block; }
            .mobile-cards { display: none !important; }
        }

        /* Mobile-only: show card layout instead of table */
        @media (max-width: 639px) {
            .table-wrap { display: none; }
            .mobile-cards { display: flex; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>
    <div class="bokeh-bg">
        <div class="spot"></div>
        <div class="spot"></div>
        <div class="spot"></div>
        <div class="spot"></div>
        <div class="spot"></div>
    </div>
    <div class="noise"></div>

    <header>
        <div class="container">
            <div class="header-inner">
                <div class="brand">
                    <div class="brand-icon">~</div>
                    <div class="brand-text">
                        <h1>BMKG Info Gempa</h1>
                        <span>Realtime Monitoring</span>
                    </div>
                </div>
                <div class="live-pill">
                    <span class="dot"></span>
                    <span id="lastUpdate">Loading</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Memuat data gempa...</p>
            </div>

            <div id="error" class="error-box" style="display:none;">
                <h3>Gagal memuat data</h3>
                <p>Terjadi kesalahan saat mengambil data dari server.</p>
                <button class="btn" onclick="loadData()">Coba Lagi</button>
            </div>

            <div id="content" style="display:none;">
                <!-- Auto -->
                <div class="section-title">
                    <span class="icon">!</span>
                    Gempa Terbaru
                    <span class="badge-count">Auto</span>
                    <span class="line"></span>
                </div>
                <div id="autoSection"></div>

                <!-- Terkini -->
                <div class="section-title">
                    <span class="icon">#</span>
                    Gempa Terkini
                    <span class="badge-count">M5.0+</span>
                    <span class="line"></span>
                </div>
                <div id="terkiniSection" class="cards-grid"></div>

                <!-- Dirasakan -->
                <div class="section-title">
                    <span class="icon">@</span>
                    Gempa Dirasakan

        async function loadData() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('content');
            const lastUpdate = document.getElementById('lastUpdate');

            loading.style.display = 'flex';
            error.style.display = 'none';
            content.style.display = 'none';

            try {
                let data;
                try {
                    const res = await fetch(API_URL, { headers: { 'Accept': 'application/json' } });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    data = await res.json();
                } catch (e) {
                    data = FALLBACK;
                }
                if (!data || !data.data) throw new Error('Invalid');

                renderAuto(data.data.auto);
                renderTerkini(data.data.terkini);
                renderDirasakan(data.data.dirasakan);
                renderDirasakanMobile(data.data.dirasakan);

                const now = new Date();
                lastUpdate.textContent = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                loading.style.display = 'none';
                content.style.display = 'block';
            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
            }
        }

        function renderAuto(auto) {
            const g = auto.Infogempa.gempa;
            const el = document.getElementById('autoSection');
            el.innerHTML = `
                <div class="glass hero-card">
                    <div class="hero-tag"><span class="ring"></span>Gempa Terbaru</div>
                    <div class="hero-body">
                        <div class="hero-mag">${g.Magnitude}<span class="unit">Sr</span></div>
                        <div class="hero-info">
                            <h2>${g.Wilayah}</h2>
                            <p>${g.Potensi || 'Informasi gempa terkini'}</p>
                            <div class="hero-chips">
                                <span class="chip"><strong>${g.Tanggal}</strong> ${g.Jam}</span>
                                <span class="chip"><strong>Kedalaman</strong> ${g.Kedalaman}</span>
                                <span class="chip"><strong>Koordinat</strong> ${g.Lintang}, ${g.Bujur}</span>
                                ${g.Dirasakan ? `<span class="chip"><strong>Dirasakan</strong> ${g.Dirasakan}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    ${g.downloadShakemap ? `<div class="hero-shakemap"><img src="${g.downloadShakemap}" alt="Shakemap" onerror="this.style.display='none'"></div>` : ''}
                </div>
            `;
        }

        function renderTerkini(terkini) {
            const list = terkini.Infogempa.gempa;
            const el = document.getElementById('terkiniSection');
            el.innerHTML = list.map((g, i) => {
                const tsunami = g.Potensi && g.Potensi.toLowerCase().includes('tsunami') && !g.Potensi.toLowerCase().includes('tidak');
                return `
                    <div class="glass data-card">
                        <div class="card-top">
                            <div class="card-mag">${g.Magnitude}<span class="unit">Sr</span></div>
                            <span class="card-status ${tsunami ? 'status-danger' : 'status-safe'}">${tsunami ? 'Tsunami' : 'Aman'}</span>
                        </div>
                        <div class="card-loc">${g.Wilayah}</div>
                        <div class="card-grid">
                            <div class="c-item"><span class="c-label">Tanggal</span><span class="c-value">${g.Tanggal}</span></div>
                            <div class="c-item"><span class="c-label">Jam</span><span class="c-value">${g.Jam}</span></div>
                            <div class="c-item"><span class="c-label">Lintang</span><span class="c-value">${g.Lintang}</span></div>
                            <div class="c-item"><span class="c-label">Bujur</span><span class="c-value">${g.Bujur}</span></div>
                        </div>
                        <div class="card-foot">
                            <span class="date">${g.Kedalaman}</span>
                            <span class="depth">${g.Potensi}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDirasakan(dirasakan) {
            const list = dirasakan.Infogempa.gempa;
            const el = document.getElementById('dirasakanTable');
            el.innerHTML = list.map((g, i) => `
                <tr style="animation: fadeUp 0.3s ease-out ${i * 0.03}s both;">
                    <td class="t-time">
                        <div class="date">${g.Tanggal}</div>
                        <div class="jam">${g.Jam}</div>
                    </td>
                    <td class="t-mag">${g.Magnitude} <span style="font-size:0.7rem; color:var(--text-muted);">Sr</span></td>
                    <td>${g.Kedalaman}</td>
                    <td class="t-wilayah">${g.Wilayah}</td>
                    <td class="t-dirasakan">${g.Dirasakan}</td>
                </tr>
            `).join('');
        }

        function renderDirasakanMobile(dirasakan) {
            const list = dirasakan.Infogempa.gempa;
            const el = document.getElementById('dirasakanMobile');
            el.innerHTML = list.map((g, i) => `
                <div class="glass m-card" style="animation-delay: ${i * 0.03}s">
                    <div class="m-card-top">
                        <div class="m-card-mag">${g.Magnitude}<span class="unit">Sr</span></div>
                        <span class="chip" style="font-size:0.7rem;">${g.Kedalaman}</span>
                    </div>
                    <div class="m-card-loc">${g.Wilayah}</div>
                    <div class="m-card-meta">
                        <span class="chip"><strong>${g.Tanggal}</strong></span>
                        <span class="chip">${g.Jam}</span>
                        <span class="chip">${g.Lintang}, ${g.Bujur}</span>
                    </div>
                    <div class="m-card-felt">
                        <strong>Dirasakan</strong>
                        ${g.Dirasakan}
                    </div>
                </div>
            `).join('');
        }

        setInterval(loadData, 300000);
        loadData();
