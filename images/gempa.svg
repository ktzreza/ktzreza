<svg
  width="16"
  height="20"
  viewBox="0 0 16 20"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Pulse group -->
  <g>
    <animateTransform
      attributeName="transform"
      type="scale"
      values="1;1.12;1"
      dur="0.8s"
      repeatCount="indefinite"
      additive="sum"
    />

    <!-- Main crack -->
    <path
      d="M8 1 L6 5 L9 8 L5 12 L10 16 L7 19"
      stroke="#000000"
      stroke-width="1.4"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Side crack -->
    <path
      d="M9 8 L12 10"
      stroke="#000000"
      stroke-width="1.1"
      fill="none"
      stroke-linecap="round"
    />
  </g>
</svg>
