<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kalkulator Online</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e6f0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column; /* agar footer bisa di bawah */
    }
    .calculator {
      background-color: #1e3a8a;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      color: #fff;
      width: 300px;
    }
    .display {
      background-color: #3b82f6;
      padding: 15px;
      border-radius: 8px;
      text-align: right;
      font-size: 1.5em;
      margin-bottom: 15px;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      padding: 15px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      background-color: #60a5fa;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2563eb;
    }
    .equal-btn {
      background-color: #22c55e; /* hijau */
      font-weight: bold;
    }
    .equal-btn:hover {
      background-color: #16a34a;
    }
    .history {
      margin-top: 15px;
      background-color: #3b82f6;
      padding: 10px;
      border-radius: 8px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 0.9em;
    }
    .history h3 {
      margin: 0 0 5px 0;
      font-size: 1em;
      text-align: center;
    }
    .history ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .history li {
      margin-bottom: 8px;
      padding: 8px 12px;
      background-color: #93c5fd; /* biru muda */
      border-radius: 16px;
      cursor: pointer;
      color: #000;
      display: inline-block;
      max-width: 90%;
      word-wrap: break-word;
    }
    .history li:hover {
      background-color: #60a5fa;
    }
    .clear-btn {
      margin-top: 10px;
      width: 100%;
      background-color: #ef4444;
    }
    .clear-btn:hover {
      background-color: #dc2626;
    }
    .footer {
      margin-top: 20px;
      background-color: #000;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      width: 300px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button onclick="clearDisplay()">C</button>
      <button onclick="appendOperator('/')">÷</button>
      <button onclick="appendOperator('*')">×</button>
      <button onclick="deleteLast()">⌫</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendOperator('-')">−</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="appendOperator('+')">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="equal-btn" onclick="calculate()">=</button>

      <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
      <button onclick="appendValue('.')">.</button>
      <button onclick="showHistory()">Histori</button>
    </div>
    <div class="history" id="history" style="display:none;">
      <h3>Histori</h3>
      <ul id="historyList"></ul>
      <button class="clear-btn" onclick="clearHistory()">Clear Histori</button>
    </div>
  </div>

  <div class="footer">
    Created by <a href="https://rz-home.web.id" target="_blank">RZ Home</a>
  </div>

  <script>
    let display = document.getElementById('display');
    let historyList = document.getElementById('historyList');
    let historyDiv = document.getElementById('history');

    function appendValue(value) {
      if (display.innerText === '0') {
        display.innerText = value;
      } else {
        display.innerText += value;
      }
    }

    function appendOperator(op) {
      let lastChar = display.innerText.slice(-1);
      if (['+', '-', '*', '/'].includes(lastChar)) {
        display.innerText = display.innerText.slice(0, -1) + op;
      } else {
        display.innerText += op;
      }
    }

    function clearDisplay() {
      display.innerText = '0';
    }

    function deleteLast() {
      if (display.innerText.length > 1) {
        display.innerText = display.innerText.slice(0, -1);
      } else {
        display.innerText = '0';
      }
    }

    function calculate() {
      let expression = display.innerText;
      if (!/[+\-*/]/.test(expression)) {
        return; // tidak bereaksi jika belum ada operator
      }
      try {
        let result = eval(expression);
        display.innerText = result;
        addToHistory(expression + ' = ' + result);
      } catch {
        display.innerText = 'Error';
      }
    }

    function addToHistory(entry) {
      let li = document.createElement('li');
      li.textContent = entry;
      li.addEventListener('click', function() {
        let parts = entry.split('=');
        if (parts.length > 1) {
          display.innerText = parts[0].trim();
        } else {
          display.innerText = entry;
        }
      });
      historyList.prepend(li);
    }

    function showHistory() {
      if (historyDiv.style.display === 'none') {
        historyDiv.style.display = 'block';
      } else {
        historyDiv.style.display = 'none';
      }
    }

    function clearHistory() {
      historyList.innerHTML = '';
    }
  </script>
</body>
</html>
